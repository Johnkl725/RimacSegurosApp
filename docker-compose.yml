version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rimac-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-YourStrong!Passw0rd}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD:-YourStrong!Passw0rd}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - rimac-network
    restart: unless-stopped

  # ASP.NET Core Web Application
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rimac-webapp
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=BDSeguros;User Id=sa;Password=$${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME:-dovonolyt}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY:-485953187691235}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET:-r9Tc-jC5Z3k0EnymDepA51o1XMU}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - rimac-network
    restart: unless-stopped

networks:
  rimac-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
